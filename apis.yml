name: Packmatic
description: 'Packmatic is a Berlin-based packaging procurement platform that helps
  companies source flexible and paper-based packaging at lower cost. It combines a
  proprietary supplier database and a smart-matching engine spanning 350+ suppliers
  with expert packaging engineers and a cloud-based platform for managing quotes,
  orders, and supplier communication. Customers pay no upfront fees; Packmatic earns
  a commission when they source through its network, reporting average savings around
  16% and reducing supplier search time by roughly 70%. Packmatic does not currently
  publish a public developer API, SDKs, or developer documentation; this profile captures
  its company identity and domain-security posture for the API Evangelist network.'
